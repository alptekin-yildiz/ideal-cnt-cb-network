[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ideal-cnt-cb-network"
version = "1.0.0"
description = "Stochastic ideal-network reference generator for CNT/CB polymer composites: percolation, conductivity, and piezoresistive response."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Merve Karabal" },
    { name = "Alptekin Yıldız" },
]
keywords = ["percolation", "carbon-nanotube", "carbon-black", "piezoresistivity", "tunneling", "Monte-Carlo"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["cntcb", "cntcb.kernel", "cntcb.engines"]
